<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Alessandro Guerra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f8f7f3;--fg:#1b2330;--fg-dim:#5a6372;--accent:#2a52c9;}
  @media (prefers-color-scheme: dark){:root{--bg:#141922;--fg:#e9e7e1;--fg-dim:#9aa3b1;--accent:#86a5ff;color-scheme:dark;}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:'Jost','Helvetica Neue',Arial,sans-serif;padding:24px;box-sizing:border-box;text-align:center;}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:40px;margin:0 0 8px;}
  p{color:var(--fg-dim);margin:0 0 24px;}
  a{color:var(--accent);}
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
